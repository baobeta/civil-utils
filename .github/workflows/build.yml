name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # needed only to create releases on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          else { $v = "0.5.0.$env:GITHUB_RUN_NUMBER" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test Core
        run: dotnet test C3DTools.Core.slnf

      - name: Package bundle
        shell: pwsh
        run: ./scripts/package-bundle.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: C3DTools-${{ steps.ver.outputs.version }}
          path: artifacts/C3DTools-${{ steps.ver.outputs.version }}/

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        # A release published from the GitHub UI creates the tag itself, so the
        # release may already exist when this runs: attach the zip instead.
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = 'artifacts/C3DTools-${{ steps.ver.outputs.version }}.zip'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip --clobber
          } else {
            gh release create $tag $zip --title "C3DTools $tag" --generate-notes
          }
